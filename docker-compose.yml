services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: origami
      POSTGRES_PASSWORD: origami
      POSTGRES_DB: origami_lens
    ports:
      - "5433:5432"
    volumes:
      - origami_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origami -d origami_lens"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  origami_pg_data:
